<main id="home">
    <section class="hero">
        <h1>ALLIN1</h1>
        <p>EVERYTHING IN ONE PLACE.</p>
        <button id="explore">EXPLORE GAMES</button>
    </section>

    <section id="games" class="content-section">
        <h2>🎮 GAME LIBRARY</h2>
        <p>Choose a game to play below.</p>

        <div class="game-grid">
            <button class="game-card"
                data-game="https://www.miniplay.com/embed/football-bros">
                🏈 Football Bros
            </button>

            <button class="game-card"
                data-game="https://poki.com/en/g/retro-bowl">
                🏆 Retro Bowl
            </button>

            <button class="game-card"
                data-game="https://driftboss.game/">
                🏎️ Drift Boss
            </button>
        </div>

        <div id="game-player" class="game-player">
            <h3>Select a game to start</h3>
            <p>Your selected game will appear here if embedding is supported.</p>
        </div>
    </section>

    <section id="youtube" class="content-section">
        <h2>▶ YouTube</h2>
        <p>Watch videos directly inside ALLIN1 when embedding is enabled.</p>

        <div class="video-player">
            <iframe
                src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </section>
</main>
